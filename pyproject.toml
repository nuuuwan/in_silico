[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "in-silico"
version = "0.1.0"
description = "Tools for reproducible in silico drug-discovery research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"chembl_webresource_client==0.10.9",
	"requests>=2.32,<3",
]

[project.scripts]
environment_check = "in_silico.environment:EnvironmentCheck.main"

[tool.setuptools.packages.find]
where = ["src"]